[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
requires-python = ">= 3.12"
license = "MIT"
readme = { file = "README.md", content-type = "text/markdown" }
name = "kanuni-sdk"
description = "A SDK for Kanuni"
authors = [{ name = "Kanuni Team", email = "team@kanuni.com" }]
keywords = ["kanuni", "sdk", "pwd", "disability"]


[tool.hatch.version]
path = "src/kanuni_sdk/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kanuni_sdk"]

dependencies = []
